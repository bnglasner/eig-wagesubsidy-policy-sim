# =============================================================================
# Canonical dataset registry — single source of truth for recognized public
# dataset knowledge used across the AI review fleet.
#
# Consumers (do not duplicate this content in agent prose; read this file):
#   - methodology-reviewer  -> MR-VU1/VU2/VU3 (weights + dataset-specific pitfalls)
#   - code-reviewer         -> Data Currency table (identification + search_strategy)
#   - ai-skeptic            -> AS-1c variable-name fabrication checks (variable_names)
#   - data-dictionary-agent -> appends project-layer variables/vintages/docs
#
# TWO LAYERS (governance-critical):
#   layer: template  -> reusable, cross-project knowledge curated by humans and
#                       shipped with the template. verification MUST be `verified`.
#   layer: project   -> per-project, vintage-pinned variable documentation written
#                       by the data-dictionary-agent. verification MUST be `parsed`
#                       until a human promotes it. The methodology-reviewer trusts a
#                       `verified` template entry as authoritative; a `parsed` entry
#                       is provisional and should be confirmed before it drives a
#                       HIGH finding.
#
# Schema is enforced by Infrastructure/scripts/validate_dataset_registry.py.
# Never invent a variable, universe, or weight. Flag gaps as "[unverified: ...]".
# =============================================================================
datasets:
  # ---------------------------------------------------------------------------
  - id: cps
    name: Current Population Survey (CPS)
    layer: template
    verification: verified
    kind: survey
    agency: U.S. Census Bureau and Bureau of Labor Statistics
    identification:
      file_patterns: ["cps_*", "cepr_cps_*", "morg_*", "asec_*", "cps_asec_*", "ipums_cps*", "cps_00*"]
      variable_names: ["wtfinl", "earnwt", "asecwt", "hwtfinl", "asecwth", "PWSSWGT", "PWCMPWGT", "PWORWGT", "MARSUPWT", "ASECWT", "HWHHWGT"]
      loaders: ["ipumsr::read_ipums_micro() with CPS DDI", "cepr_* functions"]
      comments: ["Current Population Survey", "CPS", "ASEC", "March supplement"]
    weights:
      - context: Basic monthly (person)
        ipums_name: wtfinl
        census_name: PWSSWGT
        notes: Final person weight for basic monthly labor force data.
      - context: Basic monthly (household)
        ipums_name: hwtfinl
        census_name: HWHHWGT
        notes: Household weight for basic monthly.
      - context: Earner study / outgoing rotation
        ipums_name: earnwt
        census_name: PWORWGT
        notes: Earnings weight for ORG (outgoing rotation) respondents only.
      - context: ASEC supplement (person)
        ipums_name: asecwt
        census_name: MARSUPWT / ASECWT
        notes: Annual supplement weight; required for any income/poverty analysis.
      - context: ASEC supplement (household)
        ipums_name: asecwth
        census_name: ASECWTH
        notes: Household weight for ASEC.
    pitfalls:
      - id: cps-wtfinl-for-asec
        description: Using wtfinl for ASEC income analysis (must use asecwt).
        severity: HIGH
        why: >-
          The basic monthly weight ignores the ASEC supplement's oversampling
          design and produces incorrect income and poverty statistics.
        what_to_check: "Confirm asecwt (not wtfinl) is used for any income/poverty estimate."
      - id: cps-topcoded-income
        description: Topcoded income variables (inctot, incwage, ftotval) not addressed.
        severity: MEDIUM
        what_to_check: "Verify topcoding is acknowledged, swapped to internal values, or excluded."
      - id: cps-mixing-basic-asec
        description: Mixing basic monthly and ASEC variables without appropriate weights.
        severity: HIGH
        what_to_check: "Confirm each variable is paired with the weight for its data product."
    currency:
      search_strategy: '"Current Population Survey" latest annual data site:census.gov OR site:bls.gov'
      ipums_search_strategy: '"IPUMS CPS" latest data year site:ipums.org'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: acs
    name: American Community Survey (ACS)
    layer: template
    verification: verified
    kind: survey
    agency: U.S. Census Bureau
    identification:
      file_patterns: ["acs_*", "acs5yr_*", "acs1_*", "pums_*", "acs_pums_*", "ipums_acs*", "ipums_usa*", "usa_00*"]
      variable_names: ["perwt", "hhwt", "PWGTP", "WGTP", "PWGTP1", "PWGTP80", "WGTP1", "WGTP80"]
      loaders: ["tidycensus::get_acs()", "tidycensus::get_pums()", "ipumsr::read_ipums_micro()"]
      comments: ["American Community Survey", "ACS", "PUMS"]
    weights:
      - context: Person-level
        ipums_name: perwt
        census_name: PWGTP
        notes: Person weight for all person-level analyses.
      - context: Household-level
        ipums_name: hhwt
        census_name: WGTP
        notes: Household weight for housing/household analyses.
      - context: Replicate weights (person)
        ipums_name: null
        census_name: PWGTP1-PWGTP80
        notes: 80 replicate weights for variance estimation.
      - context: Replicate weights (household)
        ipums_name: null
        census_name: WGTP1-WGTP80
        notes: 80 replicate weights for variance estimation.
    pitfalls:
      - id: acs-person-weight-for-household
        description: Using person weight (perwt) for household-level analysis.
        severity: HIGH
        what_to_check: "Confirm the weight matches the unit of analysis (person vs. household)."
      - id: acs-no-replicate-weights
        description: Not using replicate weights for standard error estimation.
        severity: LOW
        what_to_check: "Acceptable if svydesign with design variables is declared."
      - id: acs-topcoded-income
        description: Topcoded income variables not addressed.
        severity: MEDIUM
      - id: acs-mixing-1yr-5yr
        description: Mixing 1-year and 5-year estimates without acknowledging different time periods.
        severity: MEDIUM
    currency:
      search_strategy_1yr: '"American Community Survey 1-year" latest release site:census.gov'
      search_strategy_5yr: '"American Community Survey 5-year" latest release site:census.gov'
      ipums_search_strategy: '"IPUMS USA" latest data year site:ipums.org'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: atus
    name: American Time Use Survey (ATUS)
    layer: template
    verification: verified
    kind: survey
    agency: Bureau of Labor Statistics
    identification:
      file_patterns: ["atus_*", "atusact_*", "atusresp_*"]
      variable_names: ["wt06", "TUFINLWGT", "TUFNWGTP", "EUHWGT", "ehwt", "LVWGT", "lvwt"]
      loaders: []
      comments: ["American Time Use Survey", "ATUS"]
    weights:
      - context: Person-level
        name: wt06 / TUFINLWGT
        notes: Final person weight.
      - context: Eating & Health module
        name: EUHWGT / ehwt
        notes: Module-specific weight.
      - context: Leave module
        name: LVWGT / lvwt
        notes: Module-specific weight.
    pitfalls:
      - id: atus-module-weight
        description: Using ATUS person weight for module-specific analysis (must use module weight).
        severity: HIGH
      - id: atus-day-of-week
        description: Not accounting for day-of-week distribution in time use analysis.
        severity: MEDIUM
    currency:
      search_strategy: '"American Time Use Survey" latest release site:bls.gov'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: ce
    name: Consumer Expenditure Survey (CE)
    layer: template
    verification: verified
    kind: survey
    agency: Bureau of Labor Statistics
    identification:
      file_patterns: ["ce_*", "cx_*", "fmli_*", "mtbi_*", "diary_*", "consumer_exp*"]
      variable_names: ["finlwt21", "FINLWT21", "wtrep01", "wtrep44", "repwt"]
      loaders: []
      comments: ["Consumer Expenditure", "CE Survey", "CEX"]
    weights:
      - context: Interview survey (CU-level)
        name: finlwt21 / FINLWT21
        notes: Consumer unit weight (interview).
      - context: Diary survey
        name: FINLWT21 (diary)
        notes: Consumer unit weight (diary).
      - context: Replicate weights
        name: wtrep01-wtrep44
        notes: 44 replicate weights for variance estimation.
    pitfalls:
      - id: ce-mixing-interview-diary
        description: Mixing interview and diary survey data without appropriate weighting.
        severity: HIGH
      - id: ce-no-replicate-weights
        description: Not using replicate weights for variance estimation.
        severity: LOW
    currency:
      search_strategy: '"Consumer Expenditure Survey" latest release site:bls.gov'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: scf
    name: Survey of Consumer Finances (SCF)
    layer: template
    verification: verified
    kind: survey
    agency: Federal Reserve Board
    identification:
      file_patterns: ["scf_*", "scfp_*", "rscfp_*", "survey_consumer*"]
      variable_names: ["wgt", "WGT", "X42001", "YY1", "Y1", "implession", "imputation", "WGT_P"]
      loaders: []
      comments: ["Survey of Consumer Finances", "SCF"]
    weights:
      - context: Cross-section
        name: wgt / WGT / X42001
        notes: Analysis weight.
      - context: Panel
        name: WGT_P*
        notes: Panel weights vary by wave.
    pitfalls:
      - id: scf-single-implicate
        description: Using only one implicate instead of combining all five.
        severity: HIGH
        why: >-
          SCF provides 5 multiply-imputed datasets (implicates, identified by
          YY1 = 1-5 or Y1 = 1-5). Using one implicate (e.g., filtering to YY1 == 1)
          produces correct point estimates but incorrect standard errors.
        what_to_check: "Confirm all 5 implicates are combined using Rubin (1987) rules."
      - id: scf-no-weight
        description: Not using the SCF weight variable.
        severity: HIGH
    currency:
      search_strategy: '"Survey of Consumer Finances" latest wave site:federalreserve.gov'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: psid
    name: Panel Study of Income Dynamics (PSID)
    layer: template
    verification: verified
    kind: survey
    agency: University of Michigan (ISR)
    identification:
      file_patterns: ["psid_*", "fam_*", "ind_*", "family_*"]
      variable_names: ["ER34020", "ER prefix variables", "S prefix (early waves)"]
      loaders: []
      comments: ["Panel Study of Income Dynamics", "PSID"]
    weights:
      - context: Family-level (longitudinal)
        name: ER* weight variables (vary by wave)
        notes: Longitudinal family weight.
      - context: Individual-level (longitudinal)
        name: ER* weight variables (vary by wave)
        notes: Longitudinal individual weight.
      - context: Cross-section
        name: Wave-specific cross-section weight
        notes: Appropriate for single-wave analysis.
    pitfalls:
      - id: psid-cross-section-for-panel
        description: Using cross-section weight for panel analysis.
        severity: HIGH
      - id: psid-oversample
        description: Not accounting for PSID oversampling of low-income and Black families.
        severity: MEDIUM
      - id: psid-seo-dropped
        description: SEO oversample dropped without discussion.
        severity: MEDIUM
    currency:
      search_strategy: '"Panel Study of Income Dynamics" latest wave site:psidonline.isr.umich.edu'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
