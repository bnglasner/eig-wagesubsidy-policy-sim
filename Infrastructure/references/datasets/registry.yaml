    kind: administrative
    agency: FFIEC / Consumer Financial Protection Bureau
    identification:
      file_patterns: ["hmda_*", "lar_*", "hmda_lar_*", "home_mortgage*"]
      variable_names: ["action_taken", "action_taken_name", "loan_type", "loan_purpose", "derived_*"]
      loaders: []
