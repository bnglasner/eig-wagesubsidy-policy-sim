    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: bls_employment
    name: BLS Employment Data (CES / LAUS / QCEW)
    layer: template
    verification: verified
    kind: aggregate
    agency: Bureau of Labor Statistics
    identification:
      file_patterns: ["ces_*", "laus_*", "qcew_*", "bls_*", "employment_*", "unemployment_*", "quarterly_census*"]
      variable_names: ["total_nonfarm", "urate", "employment", "avg_wkly_wage", "emplvl", "PAYEMS"]
      loaders: ["blsAPI", "bls_api()", "freduse PAYEMS"]
      comments: ["Current Employment Statistics", "CES", "LAUS", "QCEW", "BLS"]
    weights: not_applicable
    weights_note: Aggregate establishment/area data.
    pitfalls:
      - id: bls-sa-vs-nsa
        description: Mixing seasonally adjusted and non-seasonally adjusted series.
        severity: MEDIUM
      - id: bls-qcew-coverage
        description: Using QCEW data (excludes self-employed, agriculture, some government) as if it covers total employment.
        severity: LOW
      - id: bls-ces-benchmark
        description: CES benchmark revision not acknowledged in long time series.
        severity: LOW
    currency:
      search_strategy_ces: '"Current Employment Statistics" latest benchmark site:bls.gov'
      search_strategy_laus: '"Local Area Unemployment Statistics" latest annual data site:bls.gov'
      search_strategy_qcew: '"Quarterly Census of Employment and Wages" latest annual data site:bls.gov'
    vintages: []
    variables: []
    docs: []
