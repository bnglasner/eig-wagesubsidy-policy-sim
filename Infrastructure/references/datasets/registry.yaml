  - id: scf
    name: Survey of Consumer Finances (SCF)
    layer: template
    verification: verified
    kind: survey
    agency: Federal Reserve Board
    identification:
      file_patterns: ["scf_*", "scfp_*", "rscfp_*", "survey_consumer*"]
      variable_names: ["wgt", "WGT", "X42001", "YY1", "Y1", "implession", "imputation", "WGT_P"]
      loaders: []
      comments: ["Survey of Consumer Finances", "SCF"]
    weights:
      - context: Cross-section
        name: wgt / WGT / X42001
        notes: Analysis weight.
      - context: Panel
        name: WGT_P*
        notes: Panel weights vary by wave.
    pitfalls:
      - id: scf-single-implicate
        description: Using only one implicate instead of combining all five.
        severity: HIGH
        why: >-
          SCF provides 5 multiply-imputed datasets (implicates, identified by
          YY1 = 1-5 or Y1 = 1-5). Using one implicate (e.g., filtering to YY1 == 1)
          produces correct point estimates but incorrect standard errors.
        what_to_check: "Confirm all 5 implicates are combined using Rubin (1987) rules."
      - id: scf-no-weight
        description: Not using the SCF weight variable.
        severity: HIGH
    currency:
      search_strategy: '"Survey of Consumer Finances" latest wave site:federalreserve.gov'
    vintages: []
    variables: []
    docs: []
