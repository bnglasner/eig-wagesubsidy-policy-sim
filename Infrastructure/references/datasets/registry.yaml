  - id: nhis
    name: National Health Interview Survey (NHIS)
    layer: template
    verification: verified
    kind: survey
    agency: National Center for Health Statistics (CDC)
    identification:
      file_patterns: ["nhis_*", "samadult_*", "samchild_*"]
      variable_names: ["WTFA", "PERWEIGHT", "SAMPWEIGHT", "APTS_WGT", "perweight", "WTFA_SA", "WTFA_SC"]
      loaders: []
      comments: ["National Health Interview Survey", "NHIS"]
    weights:
      - context: Person-level
        ipums_name: perweight
        census_name: WTFA / PERWEIGHT
        notes: Final annual person weight.
      - context: Sample Adult supplement
        ipums_name: sampweight
        census_name: WTFA_SA
        notes: Sample Adult weight.
      - context: Sample Child supplement
        ipums_name: null
        census_name: WTFA_SC
        notes: Sample Child weight.
    pitfalls:
      - id: nhis-person-for-sample-adult
        description: Using person weight for Sample Adult analysis (must use Sample Adult weight).
        severity: HIGH
      - id: nhis-2019-redesign
        description: NHIS redesign break (2019) not acknowledged in multi-year analysis.
        severity: MEDIUM
    currency:
      search_strategy: '"National Health Interview Survey" latest release site:cdc.gov OR site:ipums.org'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: sipp
    name: Survey of Income and Program Participation (SIPP)
    layer: template
    verification: verified
    kind: survey
    agency: U.S. Census Bureau
    identification:
      file_patterns: ["sipp_*", "pu_*"]
      variable_names: ["WPFINWGT", "WHFNWGT", "wpfinwgt", "whfnwgt"]
      loaders: []
      comments: ["Survey of Income and Program Participation", "SIPP"]
    weights:
      - context: Person-level
        name: WPFINWGT / wpfinwgt
        notes: Final person weight.
      - context: Household-level
        name: WHFNWGT / whfnwgt
        notes: Final household weight.
    pitfalls:
      - id: sipp-person-for-household
        description: Using person weight for household-level analysis.
        severity: HIGH
