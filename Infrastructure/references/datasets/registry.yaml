        name: R*WTRESP (wave-specific)
        notes: Respondent weight.
      - context: Household-level
        name: R*WTHH (wave-specific)
        notes: Household weight.
    pitfalls:
      - id: hrs-respondent-for-household
        description: Using respondent weight for household-level analysis.
        severity: HIGH
      - id: hrs-cohort-structure
        description: Not accounting for HRS cohort structure (HRS, AHEAD, CODA, WB, EBB, MBB).
        severity: LOW
    currency:
      search_strategy: '"Health and Retirement Study" latest wave site:hrs.isr.umich.edu'
    vintages: []
    variables: []
    docs: []
