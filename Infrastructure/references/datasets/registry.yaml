  - id: decennial_census
    name: Decennial Census
    layer: template
    verification: verified
    kind: survey
    agency: U.S. Census Bureau
    identification:
      file_patterns: ["census_*", "dec_*", "census_2020*", "census_2010*"]
      variable_names: ["perwt", "hhwt"]
      loaders: ["tidycensus::get_decennial()"]
      comments: ["Decennial Census", "Census 2000", "Census 2010", "Census 2020"]
    weights:
      - context: Person-level (PUMS)
        ipums_name: perwt
        census_name: null
        notes: Person weight.
      - context: Household-level (PUMS)
        ipums_name: hhwt
        census_name: null
        notes: Household weight.
    pitfalls:
      - id: census-person-for-household
        description: Using person weight for household-level analysis.
        severity: HIGH
      - id: census-cross-year-harmonization
        description: Comparing across census years without harmonization (variable definitions change).
        severity: MEDIUM
    currency:
      search_strategy: '"decennial census" latest data release site:census.gov'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: hmda
    name: Home Mortgage Disclosure Act (HMDA)
    layer: template
    verification: verified
    kind: administrative
    agency: FFIEC / Consumer Financial Protection Bureau
    identification:
      file_patterns: ["hmda_*", "lar_*", "hmda_lar_*", "home_mortgage*"]
      variable_names: ["action_taken", "action_taken_name", "loan_type", "loan_purpose", "derived_*"]
      loaders: []
      comments: ["HMDA", "Home Mortgage Disclosure Act", "LAR"]
    weights: not_applicable
    weights_note: HMDA is administrative data, not a survey — no sampling weights.
    pitfalls:
      - id: hmda-not-filtered-to-originations
        description: Not filtering to originations (action_taken == 1).
        severity: HIGH
        why: >-
          HMDA includes all application actions (originated, denied, withdrawn,
          etc.). Mortgage market analysis typically requires filtering to
          action_taken == 1. Using unfiltered data inflates counts and distorts rates.
        what_to_check: "Confirm an action-type filter is present when discussing mortgage volumes or rates."
      - id: hmda-loan-purpose
        description: Not filtering by loan purpose when analyzing purchase vs. refinance.
        severity: MEDIUM
      - id: hmda-2018-rule-change
        description: Using pre-2018 and post-2018 HMDA data without acknowledging the reporting rule change.
        severity: MEDIUM
    currency:
      search_strategy: '"HMDA" latest data release site:ffiec.gov OR site:consumerfinance.gov'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: cpi
    name: Consumer Price Index (CPI)
    layer: template
    verification: verified
    kind: aggregate
    agency: Bureau of Labor Statistics
    identification:
      file_patterns: ["cpi_*", "cpi_u_*", "cpiurs_*", "deflator_*", "cu.data*"]
      variable_names: ["cpi", "cpi_u", "cpi_u_rs", "c_cpi_u", "pce_deflator", "CPIAUCSL"]
      loaders: ["freduse CPIAUCSL", 'fredr("CPIAUCSL")', "fredapi"]
      comments: ["CPI", "Consumer Price Index", "deflator", "real dollars"]
    weights: not_applicable
    weights_note: Aggregate price index, not microdata.
    pitfalls:
      - id: cpi-variant-unspecified
        description: Deflator variant unspecified (CPI-U vs CPI-U-RS vs C-CPI-U vs PCE).
        severity: MEDIUM
        why: >-
          CPI-U, CPI-U-RS, C-CPI-U, and the PCE deflator produce different real
          series. The choice matters over long spans (CPI-U-RS adjusts for
          historical formula changes).
        what_to_check: "Confirm the deflator variant is named in a comment or variable name."
      - id: cpi-historical-variant
        description: Using CPI-U for historical comparisons spanning pre-1978 without CPI-U-RS.
        severity: MEDIUM
      - id: cpi-base-year
        description: Base year not documented.
        severity: LOW
    currency:
      search_strategy: '"Consumer Price Index" latest release site:bls.gov'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
  - id: pwt
    name: Penn World Table (PWT)
    layer: template
    verification: verified
    kind: aggregate
    agency: University of Groningen / UC Davis (Feenstra et al.)
    identification:
      file_patterns: ["pwt_*", "pwt*.xlsx", "pwt*.csv", "penn_world*"]
      variable_names: ["rgdpe", "rgdpo", "ctfp", "avh", "emp", "labsh", "csh_*"]
      loaders: []
      comments: ["Penn World Table", "PWT", "Feenstra"]
    weights: not_applicable
    weights_note: Country-level aggregate data.
    pitfalls:
      - id: pwt-rgdpe-vs-rgdpo
        description: Using rgdpe (expenditure-side) vs. rgdpo (output-side) without specifying which and why.
        severity: LOW
      - id: pwt-version-mixing
        description: Mixing PWT versions (e.g., 9.1 and 10.01) without noting methodological differences.
        severity: MEDIUM
    currency:
      search_strategy: '"Penn World Table" latest version'
    vintages: []
    variables: []
    docs: []
  # ---------------------------------------------------------------------------
