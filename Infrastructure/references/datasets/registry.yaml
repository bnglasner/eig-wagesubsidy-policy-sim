# =============================================================================
# Canonical dataset registry — single source of truth for recognized public
# dataset knowledge used across the AI review fleet.
#
# Consumers (do not duplicate this content in agent prose; read this file):
#   - methodology-reviewer  -> MR-VU1/VU2/VU3 (weights + dataset-specific pitfalls)
#   - code-reviewer         -> Data Currency table (identification + search_strategy)
#   - ai-skeptic            -> AS-1c variable-name fabrication checks (variable_names)
#   - data-dictionary-agent -> appends project-layer variables/vintages/docs
#
# TWO LAYERS (governance-critical):
#   layer: template  -> reusable, cross-project knowledge curated by humans and
#                       shipped with the template. verification MUST be `verified`.
#   layer: project   -> per-project, vintage-pinned variable documentation written
#                       by the data-dictionary-agent. verification MUST be `parsed`
#                       until a human promotes it. The methodology-reviewer trusts a
#                       `verified` template entry as authoritative; a `parsed` entry
#                       is provisional and should be confirmed before it drives a
#                       HIGH finding.
#
# Schema is enforced by Infrastructure/scripts/validate_dataset_registry.py.
# Never invent a variable, universe, or weight. Flag gaps as "[unverified: ...]".
# =============================================================================
datasets:
  # ---------------------------------------------------------------------------
  - id: cps
    name: Current Population Survey (CPS)
    layer: template
    verification: verified
    kind: survey
    agency: U.S. Census Bureau and Bureau of Labor Statistics
    identification:
      file_patterns: ["cps_*", "cepr_cps_*", "morg_*", "asec_*", "cps_asec_*", "ipums_cps*", "cps_00*"]
      variable_names: ["wtfinl", "earnwt", "asecwt", "hwtfinl", "asecwth", "PWSSWGT", "PWCMPWGT", "PWORWGT", "MARSUPWT", "ASECWT", "HWHHWGT"]
      loaders: ["ipumsr::read_ipums_micro() with CPS DDI", "cepr_* functions"]
      comments: ["Current Population Survey", "CPS", "ASEC", "March supplement"]
    weights:
      - context: Basic monthly (person)
        ipums_name: wtfinl
        census_name: PWSSWGT
        notes: Final person weight for basic monthly labor force data.
      - context: Basic monthly (household)
        ipums_name: hwtfinl
        census_name: HWHHWGT
        notes: Household weight for basic monthly.
      - context: Earner study / outgoing rotation
        ipums_name: earnwt
        census_name: PWORWGT
        notes: Earnings weight for ORG (outgoing rotation) respondents only.
      - context: ASEC supplement (person)
        ipums_name: asecwt
        census_name: MARSUPWT / ASECWT
        notes: Annual supplement weight; required for any income/poverty analysis.
      - context: ASEC supplement (household)
        ipums_name: asecwth
        census_name: ASECWTH
        notes: Household weight for ASEC.
    pitfalls:
      - id: cps-wtfinl-for-asec
        description: Using wtfinl for ASEC income analysis (must use asecwt).
        severity: HIGH
        why: >-
          The basic monthly weight ignores the ASEC supplement's oversampling
          design and produces incorrect income and poverty statistics.
        what_to_check: "Confirm asecwt (not wtfinl) is used for any income/poverty estimate."
      - id: cps-topcoded-income
        description: Topcoded income variables (inctot, incwage, ftotval) not addressed.
        severity: MEDIUM
        what_to_check: "Verify topcoding is acknowledged, swapped to internal values, or excluded."
      - id: cps-mixing-basic-asec
        description: Mixing basic monthly and ASEC variables without appropriate weights.
        severity: HIGH
        what_to_check: "Confirm each variable is paired with the weight for its data product."
    currency:
      search_strategy: '"Current Population Survey" latest annual data site:census.gov OR site:bls.gov'
      ipums_search_strategy: '"IPUMS CPS" latest data year site:ipums.org'
    vintages: []
    # -------------------------------------------------------------------------
    # PROJECT LAYER (eig-wagesubsidy-policy-sim): CPS ORG basic-monthly variables
    # used by the wage-subsidy pipeline. verification: parsed. See docs entry.
    # Tier 1 = confirmed vs in-repo IPUMS DDI cps_00305 (IPUMS CPS v13.0, ASEC 2025);
    #          IPUMS-integrated coding applies to the basic-monthly ORG extract.
    # Tier 2 = in-repo pipeline docs/code, NOT the authoritative ORG DDI.
    # Tier 3 = requested but undocumented in-repo; requires an ORG DDI fetch.
    # -------------------------------------------------------------------------
    variables:
      # --- Tier 1: confirmed against the in-repo IPUMS DDI (cps_00305.xml) ---
      - name: YEAR
        vintage: "IPUMS-CPS basic monthly ORG 2025–2026 (*2 era); coding per IPUMS CPS v13.0 (ASEC 2025 DDI)"
        source: "IPUMS CPS v13.0 DDI (in-repo extract cps_00305); Infrastructure/references/literature/data_dictionaries/2025_cps-asec_dictionary.xml"
        definition: "Year in which the survey was conducted."
        universe: "All records (technical variable)."
        coding: "4-digit numeric."
        verification: parsed
      - name: MONTH
        vintage: "IPUMS-CPS basic monthly ORG 2025–2026 (*2 era); coding per IPUMS CPS v13.0 (ASEC 2025 DDI)"
        source: "IPUMS CPS v13.0 DDI (in-repo extract cps_00305); Infrastructure/references/literature/data_dictionaries/2025_cps-asec_dictionary.xml"
        definition: "Calendar month of the CPS interview."
        universe: "All records."
        coding: "01 January … 12 December."
        verification: parsed
      - name: CPSIDP
        vintage: "IPUMS-CPS basic monthly ORG 2025–2026 (*2 era); coding per IPUMS CPS v13.0 (ASEC 2025 DDI)"
        source: "IPUMS CPS v13.0 DDI (in-repo extract cps_00305); Infrastructure/references/literature/data_dictionaries/2025_cps-asec_dictionary.xml"
        definition: "IPUMS-CPS longitudinal person identifier linking individuals across samples via the 4-8-4 rotation (max 8 appearances, indexed by MISH). DDI advises verifying links with AGE/SEX/RACE."
        universe: "All persons."
        coding: "14-digit numeric."
        verification: parsed
      - name: EARNWT
        vintage: "IPUMS-CPS basic monthly ORG 2025–2026 (*2 era); coding per IPUMS CPS v13.0 (ASEC 2025 DDI)"
        source: "IPUMS CPS v13.0 DDI (in-repo extract cps_00305); Infrastructure/references/literature/data_dictionaries/2025_cps-asec_dictionary.xml"
        definition: "Person-level Outgoing Rotation / Earner Study weight; the correct weight for EARNWEEK, HOURWAGE, PAIDHOUR, UNION, UHRSWORKORG, WKSWORKORG, ELIGORG, OTPAY."
        universe: "DDI (explicitly generalizes to basic monthly after 2010): civilians age 16+ in rotation groups (MISH) 4 or 8 who are not self-employed. EARNWT = 0 for the 6 non-earner-study rotations and for armed forces even in rotations 4/8."
        coding: "8-digit with 4 implied decimals; IPUMS command files divide by 10,000."
        note: "Correct weight for employed-earner wage statistics (01a). ~0 for non-earners, so the non-employed pool (01h) uses WTFINL. Pipeline converts monthly ORG weights via earnwt / n_months."
