        description: Not addressing seam bias in monthly income data.
        severity: MEDIUM
        why: "Income changes cluster at interview reference-period boundaries."
    currency:
      search_strategy: '"Survey of Income and Program Participation" latest panel site:census.gov'
    vintages: []
    variables: []
    docs: []
