      comments: ["QWI", "LEHD", "LODES", "Quarterly Workforce Indicators"]
    weights: not_applicable
    weights_note: Aggregate administrative data.
    pitfalls:
      - id: qwi-filters-unspecified
        description: Not specifying firm type (private, all) or worker age/sex/education filters.
