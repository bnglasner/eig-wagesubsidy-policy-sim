      - id: hmda-not-filtered-to-originations
        description: Not filtering to originations (action_taken == 1).
        severity: HIGH
        why: >-
          HMDA includes all application actions (originated, denied, withdrawn,
          etc.). Mortgage market analysis typically requires filtering to
          action_taken == 1. Using unfiltered data inflates counts and distorts rates.
        what_to_check: "Confirm an action-type filter is present when discussing mortgage volumes or rates."
      - id: hmda-loan-purpose
        description: Not filtering by loan purpose when analyzing purchase vs. refinance.
        severity: MEDIUM
      - id: hmda-2018-rule-change
        description: Using pre-2018 and post-2018 HMDA data without acknowledging the reporting rule change.
        severity: MEDIUM
