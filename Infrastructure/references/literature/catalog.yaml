  # --- Thread 6 (cont.): married / partnered / childless-single women (`other_women` band) ---
  - id: 2004-eissa-hoynes-eitc-married-couples
    title: "Taxes and the Labor Market Participation of Married Couples: The Earned Income Tax Credit"
    type: paper
    topic_tags: [tier-1, eitc, married-women, second-earner-disincentive, household-income-test, extensive-margin, negative-effect, measured-ex-post, thread-6-decomposition, other-women-band]
    path: Infrastructure/references/literature/summaries/2004_eissa-hoynes_eitc-married-couples-participation.md
    summary_path: Infrastructure/references/literature/summaries/2004_eissa-hoynes_eitc-married-couples-participation.md
    source_url: https://www.sciencedirect.com/science/article/abs/pii/S0047272703001440
    doi: 10.1016/j.jpubeco.2003.09.005
    added_on: 2026-07-08
    status: parsed
    relevance_note: "The canonical secondary-earner result: 1984-96 EITC expansions REDUCED married women's labor-force participation by just over one percentage point (1993 expansion DiD: ~1pp; reduced-form: ~1pp) while raising married men's only slightly — 'the EITC is effectively subsidizing married mothers to stay at home.' Magnitude verified against two Eissa-Hoynes-authored NBER sources (w6856 abstract; w11729 full text read directly). KEY for the other_women band: the dominant channel is the HOUSEHOLD-INCOME phase-out, which the individually-assessed 80-80 lacks by design; only the smaller intra-household income-effect channel (Bonin 2003's coordination result) transfers. Supports widening the other_women band downward toward ~0, NOT a negative central value. JPubE 88(9-10):1931-1958 (DOI validated)."

  - id: 2007-blau-kahn-married-women-labor-supply
    title: "Changes in the Labor Supply Behavior of Married Women: 1980-2000"
    type: paper
    topic_tags: [tier-1, married-women, labor-supply-elasticity, elasticity-decline, cross-wage-elasticity, measured-ex-post, thread-a, thread-6-decomposition, other-women-band]
    path: Infrastructure/references/literature/summaries/2007_blau-kahn_married-women-labor-supply-1980-2000.md
