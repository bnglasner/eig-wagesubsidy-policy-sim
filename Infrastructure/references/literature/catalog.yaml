  # --- Angle 4 (cont.): DIRECT wage-subsidy / in-work-benefit / earnings-supplement program evaluations ---
  - id: 2005-card-hyslop-time-limited-earnings-subsidy
    title: "Estimating the Effects of a Time-Limited Earnings Subsidy for Welfare-Leavers"
    type: paper
    topic_tags: [tier-1, earnings-supplement, wage-fill-analog, extensive-margin, self-sufficiency-project, experimental, measured-ex-post, thread-b-angle4]
    path: Infrastructure/references/literature/summaries/2005_card-hyslop_time-limited-earnings-subsidy-ssp.md
    summary_path: Infrastructure/references/literature/summaries/2005_card-hyslop_time-limited-earnings-subsidy-ssp.md
    source_url: https://onlinelibrary.wiley.com/doi/abs/10.1111/j.1468-0262.2005.00637.x
    doi: 10.1111/j.1468-0262.2005.00637.x
    added_on: 2026-06-25
    status: parsed
    relevance_note: "Closest experimental analog to a wage-fill: randomized earnings supplement conditional on full-time work (Canadian SSP). Large entry response during eligibility, fading after sunset; separates 'establishment' vs 'entitlement' incentives. Directly narrows the #1 gap (no measured elasticity for a wage-FILL design). Econometrica 73(6):1723-1770 (DOI validated). 2026-07-08: NBER w10647 PDF and SRDC final report (Michalopoulos et al. 2002, SSP54) read directly; recipient-sample numbers pinned -- full-time employment impact +12.6pp*** Year-2 average (28.5 vs 16.0, more than doubling), monthly peak ~15pp at start of Year 2, fading to ~2-3pp by Year 5; earnings +$101/month*** at Year-2 peak; supplement = half the gap to a $30,000 (NB) / $37,000 (BC) benchmark, roughly doubling PRE-TAX earnings at the minimum wage (~30 percent smaller net of taxes/transfers). Applicant-sample contrast (Ford et al. 2006, SSP72): +11.7pp peak in Year 3 with effects PERSISTING five years. See summary addendum."

