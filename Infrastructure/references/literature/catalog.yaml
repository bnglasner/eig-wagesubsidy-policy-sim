    doi: 10.1257/aer.103.5.1797
    added_on: 2026-07-09
    status: parsed
    relevance_note: "The standard causal bound on disabled-pool work capacity: only ~23 percent of SSDI applicants are marginal (examiner-dependent), and for them employment would have been 28pp higher WITHOUT benefit receipt (0 for severe impairments, up to ~50pp for the least severe). Treatment is complete benefit denial -- far stronger than a wage subsidy stacking against SSDI's earnings-test benefit-loss risk. Caps the defensible entry-risk share of the model's ~9.7M disabled segment at a small fraction. AER 103(5):1797-1829 (DOI validated)."

