  - id: 2018-hall-mueller-wage-dispersion-search
    title: "Wage Dispersion and Search Behavior: The Importance of Nonwage Job Values"
    type: paper
    topic_tags: [tier-1, reservation-wage, nonwage-job-values, value-of-nonemployment, search, structural-estimation, measured-ex-post, thread-4-smm, t4-thread4, thread-7-entry-anchor]
