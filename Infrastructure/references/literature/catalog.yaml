  - id: 2013-huttunen-pirttila-uusitalo-low-wage-subsidies
    title: "The Employment Effects of Low-Wage Subsidies"
    type: paper
    topic_tags: [tier-1, wage-subsidy, non-eitc, extensive-margin, null-result, employer-side, non-categorical, finland, measured-ex-post, thread-6-decomposition, household-composition-channel]
    path: Infrastructure/references/literature/summaries/2013_huttunen-pirttila-uusitalo_employment-effects-low-wage-subsidies.md
    summary_path: Infrastructure/references/literature/summaries/2013_huttunen-pirttila-uusitalo_employment-effects-low-wage-subsidies.md
    source_url: https://www.sciencedirect.com/science/article/abs/pii/S0047272712001065
    doi: 10.1016/j.jpubeco.2012.09.007
    added_on: 2026-07-08
    status: parsed
    relevance_note: "Genuine non-EITC wage-subsidy evidence (Finnish employer-side payroll subsidy for older low-wage workers): finds NO extensive-margin employment effect, a small intensive-margin hours increase for incumbents. Complicates the 'removing EITC frictions increases entry' thesis -- either an employer-side-delivery artifact or evidence of a general labor-supply constraint. JPubEc 97:49-60 (DOI validated). 2026-07-08 re-verification: CONFIRMED employer-side (payroll-tax subsidy to the firm, not the worker) and CONFIRMED non-categorical (age/wage/hours eligibility only, no household-composition or children test) -- eligibility was never conditioned on children, so this paper speaks to the delivery-channel caution, not to the household-composition-channel question; citing it against that specific channel would overreach. See updated summary."

  - id: 2003-bonin-kempe-schneider-kombilohn-workfare
    title: "Kombilohn oder Workfare? Zur Wirksamkeit zweier arbeitsmarktpolitischer Strategien"
    type: paper
    topic_tags: [tier-1, wage-subsidy, non-eitc, kombilohn, worker-side, non-categorical, germany, deadweight-loss, modeled-ex-ante, thread-6-decomposition, household-composition-channel]
    path: Infrastructure/references/literature/summaries/2003_bonin-kempe-schneider_kombilohn-workfare.md
    summary_path: Infrastructure/references/literature/summaries/2003_bonin-kempe-schneider_kombilohn-workfare.md
    source_url: https://docs.iza.org/dp587.pdf
    doi: 10.3790/vjh.72.1.51
    added_on: 2026-07-08
    status: parsed
    relevance_note: "The requested German Kombilohn wage-subsidy evidence. Microsimulation: wage subsidies produce only MARGINAL participation gains (37,300-104,000 net additional workers, a 2.3 percent stock reduction even in the generous variant), offset by negative intensive-margin (work-time) effects and high deadweight cost; workfare outperforms on net employment in this model. 2026-07-08 re-verification (full IZA DP 587 text read): CONFIRMED worker-side delivery (cash top-up paid to the worker via tax/welfare authority based on gross earnings, not an employer payroll rebate) and CONFIRMED non-categorical eligibility (scales with earnings only; worked example is an explicitly CHILDLESS single person). New finding: men's AGGREGATE labor supply nets NEGATIVE under the subsidy via intra-household coordination (subsidy claimed by the lower-wage/typically female partner, higher-earning male partner then works less) -- an EITC-like gendered pattern (gains concentrated among women, none/negative for men) produced by a non-categorical, worker-side subsidy, which undercuts rather than supports an expectation that removing categorical conditioning alone raises male entry. VfW 72(1):51-67 (DOI validated). See updated summary."

  - id: 2015-nichols-rothstein-eitc-handbook-chapter
    title: "The Earned Income Tax Credit (EITC)"
    type: paper
    topic_tags: [tier-1, eitc, handbook, household-composition-channel, childless-credit, non-custodial-parents, incidence, take-up, thread-6-decomposition]
    path: Infrastructure/references/literature/summaries/2015_nichols-rothstein_eitc-handbook-chapter.md
    summary_path: Infrastructure/references/literature/summaries/2015_nichols-rothstein_eitc-handbook-chapter.md
    source_url: https://www.nber.org/papers/w21211
    added_on: 2026-07-08
    status: parsed
    relevance_note: "Comprehensive EITC review (NBER WP 21211; published as a chapter in Moffitt ed., Economics of Means-Tested Transfer Programs Vol. I, U Chicago Press 2016). Pins the household-composition-channel mechanics directly: the 1993/1994 childless credit maxed at only ~15 percent of the one-child maximum; non-custodial parents are generally EITC-ineligible even when supporting a child; childless/ineligible workers may also bear wage-incidence costs of parents' EITC-induced labor supply without an offsetting credit; take-up is separately lower for childless filers (56-65 percent vs. 82-86 percent for parents). Does NOT provide a formal decomposition of credit-generosity vs. elasticity-by-family-type as the source of the parent/childless response gap -- confirms no clean decomposition exists in the literature. [unverified: published-chapter DOI 10.7208/9780226370507-004 does not resolve via doi.org; NBER working-paper version read in full instead]."

  - id: 2011-neumark-wascher-minimum-wage-eitc-effectiveness
