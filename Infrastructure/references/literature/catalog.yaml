    relevance_note: "Key payment-CHANNEL salience paper. UK WFTC was paid through the employer (not directly to the worker like the EITC), making it salient to the FIRM: employers cut claimant wages ~30% of the credit value (~7% of wage), with negative spillovers to non-claimant coworkers. Shows delivery channel/salience changes wage incidence independent of schedule generosity -- a caution for the 80-80's incidence module, not only evidence for the entry margin. Quantitative Economics 10(1):239-273 (DOI validated)."

