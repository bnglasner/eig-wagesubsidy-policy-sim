    source_url: https://www.journals.uchicago.edu/doi/10.1086/513416
    doi: 10.1086/513416
    added_on: 2026-07-08
    status: parsed
    relevance_note: "Married women's own-wage labor-supply elasticity FELL 50-56 percent between 1980 and 2000, and the (negative) elasticity wrt husband's wage fell 38-47 percent in absolute value (verified from the authors' abstract; level estimates ~0.8-0.9 -> ~0.4 commonly cited but [unverified] this pass). Married women remain MORE wage-elastic than men and single women (per McClelland-Mok 2012) — the ordering behind other_women sitting between men and single mothers is right — but older married-women elasticities are upper bounds, and the household-coordination drag is itself shrinking. JOLE 25(3):393-438 (DOI validated)."

