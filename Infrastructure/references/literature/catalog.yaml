    relevance_note: "The measured/structural WFTC evaluation quantifying the second-earner penalty of a household-income-assessed credit: by 2002 WFTC raised lone mothers' labour supply +5.11pp but REDUCED mothers-in-couples' by 0.57pp (fathers in couples +0.75pp; net +81,000 workers) — numbers pinned to the directly-read HMRC final-evaluation abstract (2005 report version). Bounds the household-testing drag on partnered women at roughly -0.5 to -1pp even under a full family means test — the design cell the 80-80 avoids. Labour Economics 13(6):699-720 (DOI validated; journal-version point estimates [unverified], possibly -0.2pp in the published vintage)."

