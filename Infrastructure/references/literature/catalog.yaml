    doi: 10.1177/001979391106400405
    added_on: 2026-07-08
    status: parsed
    relevance_note: "State EITC x minimum-wage difference-in-differences. EITC generosity + higher minimum wage REINFORCES single mothers' employment gains but produces ADVERSE employment/earnings effects for less-skilled minority men and childless women -- a crowd-out/rationing channel distinct from (additive to) the childless credit's own small size. Flags a not-yet-verifiable newer AEA 2026 conference paper ('Unintended Consequences: Childless Workers, the EITC, and the Minimum Wage') as a lead for the next scouting pass, not cited as a source. ILR Review 64(4):712-746 (DOI validated)."

  - id: 2018-miller-katz-azurdia-isen-schultz-aloisi-paycheck-plus-nyc
    title: "Boosting the Earned Income Tax Credit for Singles: Final Impact Findings from the Paycheck Plus Demonstration in New York City"
    type: paper
    topic_tags: [tier-2, eitc, childless-workers, non-categorical, rct, measured-ex-post, noncustodial-parents, household-composition-channel, thread-6-decomposition]
    path: Infrastructure/references/literature/summaries/2018_miller-katz-azurdia-isen-schultz-aloisi_paycheck-plus-nyc.md
    summary_path: Infrastructure/references/literature/summaries/2018_miller-katz-azurdia-isen-schultz-aloisi_paycheck-plus-nyc.md
    source_url: https://www.mdrc.org/work/publications/boosting-earned-income-tax-credit-singles
    added_on: 2026-07-08
    status: parsed
    relevance_note: "PRIORITY: the closest experimental (RCT, n>6,000) test of the household-composition-channel hypothesis. A non-categorical, worker-side, earnings-linked credit (up to $2,000, income cap $30,000, ~4x/2x the federal childless EITC) raised overall employment 2.1-2.6pp, concentrated among women (up to 4.6pp) and 'disadvantaged men' including NONCUSTODIAL PARENTS and formerly incarcerated individuals (up to 5.8pp) -- well above the EITC-implied ~0.05 near-zero male response. Must be read against the Atlanta null replication (Yang et al. 2022, cataloged) -- genuinely mixed evidence, not a clean confirmation. 2026-07-08: primary report PDF read directly; Table ES.2 numbers now pinned -- all women +2.3*/+4.6***/+2.6* by year, +3.2pp*** pooled Years 1-3 (the study's most robust subgroup effect; these are CHILDLESS SINGLE women, direct evidence for the other_women cell); all men +0.5 ns pooled; more-disadvantaged men +5.8pp** in Year 3 only (+2.8 ns pooled). Earlier [unverified] flags on the 5.8/4.6 figures and author metadata resolved; see summary addendum."

  - id: 2022-yang-bernardi-miller-katz-isen-paycheck-plus-atlanta
    title: "An Earned Income Tax Credit That Works for Singles: Final Impact Findings from the Paycheck Plus Demonstration in Atlanta"
    type: paper
    topic_tags: [tier-2, eitc, childless-workers, non-categorical, rct, null-result, measured-ex-post, household-composition-channel, thread-6-decomposition]
    path: Infrastructure/references/literature/summaries/2022_yang-bernardi-miller-katz-isen_paycheck-plus-atlanta.md
    summary_path: Infrastructure/references/literature/summaries/2022_yang-bernardi-miller-katz-isen_paycheck-plus-atlanta.md
    source_url: https://www.mdrc.org/work/publications/earned-income-tax-credit-works-singles
    added_on: 2026-07-08
    status: parsed
    relevance_note: "PRIORITY: direct second-site RCT replication of Paycheck Plus NYC (Miller et al. 2018, cataloged) using the same non-categorical, earnings-linked design. Found NO employment effect in any year, for any subgroup (women, disadvantaged men, or overall) -- a precise null that directly contradicts the NYC result. The pair together is the single best piece of evidence that a non-categorical wage/earnings credit for childless and noncustodial men CAN but does NOT RELIABLY produce a larger employment response than the EITC's own near-zero male pattern -- supports a wide M2 band, not a raised central estimate. 2026-07-08: primary report PDF read directly; null point estimates now pinned WITH SEs/p-values (full sample any-earnings +0.1/+1.0/+1.1pp by year, all p>0.35; disadvantaged men -0.3/+0.7/+0.8pp, all p>0.69; women +0.5/-0.9/0.0pp, all p>0.63; Tables ES.1/7/8). CORRECTIONS: title page lists SIX authors (adds Rachael Metz); registered identifier OPRE Report 2022-54 exists; analysis N = 3,972 (1,996/1,976), not ~2,000 total. Early-year earnings gains for LESS disadvantaged men (p=0.015-0.052, faded by Year 3) are the one non-null pattern. See summary addendum."

