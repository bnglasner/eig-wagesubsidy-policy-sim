    doi: 10.1111/j.1475-5890.2000.tb00581.x
    added_on: 2026-06-25
    status: parsed
    relevance_note: "Leading non-US in-work-benefit analog (UK WFTC). Structural simulation: net participation gain is small because single-parent entry is offset by second-earner withdrawal under joint income tests. The extensive-vs-second-earner heterogeneity the broad 80-80 must carry. Fiscal Studies 21(1):75-104 (DOI validated)."

  - id: 1998-katz-wage-subsidies-disadvantaged
