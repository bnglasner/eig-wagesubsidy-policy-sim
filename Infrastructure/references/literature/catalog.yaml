    doi: 10.1257/000282802320191642
    added_on: 2026-07-08
    status: parsed
    relevance_note: "The specific 'Meyer 2002' citation embedded in 00_config.py comments and the two Agglomerations articles, re-verified. Documents that the EITC/welfare-reform labor-supply response for single mothers is almost entirely an EXTENSIVE-margin (participation) effect with little intensive-margin (hours) response. Does NOT itself contrast single mothers against men/childless adults -- that demographic-heterogeneity claim rests on McClelland & Mok (2012) and Hotz & Scholz, both already cataloged. AER P&P 92(2):373-379 (DOI validated)."

