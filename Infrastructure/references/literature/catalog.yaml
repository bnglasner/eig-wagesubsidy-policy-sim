    doi: 10.1257/aer.20141566
    added_on: 2026-07-09
    status: parsed
    relevance_note: "Causal anchor for the wage-scale sanity check (NBER w19772 read directly): each month of nonemployment reduces reemployment WAGE OFFERS by 0.8 percent (German admin data, age-discontinuity RD/IV) -- offers deteriorate with time out, ~17-18 percent at 24 months, compounding for the multi-year NILF stock. Implies the model's all-earner (44 percent salaried) MPL imputation overstates the long-nonemployed pool's opportunities; with Krueger-Mueller's accepted-wage ratio ~0.90, entrants take entry-priced jobs 10-30 percent below incumbent-structure imputations. Cuts BOTH ways: more of the pool is below the $16.80 target (larger eligible share) but on lower private wages (bigger fill per entrant, weaker net-gain arithmetic at imputed wages). AER 106(3):739-777 (DOI validated). [unverified: US-level analog not cataloged this pass]."
