    status: parsed
    relevance_note: "Canonical decomposition of the 1993-99 single-mother employment surge (NBER w8153 read in full): EITC explains 34 percent of the employment increase ($1,000 max-credit increase -> +3.6pp employment), business cycle 21 percent, welfare reforms the rest; policy+EITC+cycle jointly explain 71 percent. With Fang-Keane 2004: the wage-subsidy component ALONE of the closest macro-scale precedent moved single-mother employment ~3-4pp over ~6 years, in the most wage-responsive demographic on record, with a boom and welfare-reform sticks assisting. The per-dollar benchmark any 80-80 entry projection should be compared against. REStat 85(2):394-408 (DOI validated)."

