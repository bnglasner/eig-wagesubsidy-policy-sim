    source_url: https://www.brookings.edu/wp-content/uploads/2004/01/2004a_bpea_fang.pdf
    doi: 10.1353/eca.2004.0015
    added_on: 2026-07-09
    status: parsed
    relevance_note: "Brookings-hosted final PDF read directly; headline decomposition PINNED: single mothers' work participation rose 11.3pp from 1993 to 2002, attributed EITC 33 percent (~3.7pp), macroeconomy 25 percent, work requirements 17 percent, time limits 10 percent; welfare participation fell 23pp (work requirements 57 percent). Post-1996 the work rate rose only 74->79 percent -- most of the gain came in the 1993-96 EITC+boom window. Nearly one-quarter of welfare leavers did not start work. THE quantitative anchor for what a permanent several-thousand-dollar increase in the net return to work did at macro scale for the most responsive group. BPEA 2004(1):1-116 (DOI via Crossref)."

