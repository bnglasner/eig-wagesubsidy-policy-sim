  - id: 2012-mcclelland-mok-cbo-elasticity-review
    title: "A Review of Recent Research on Labor Supply Elasticities (CBO Working Paper 2012-12)"
    type: technical_note
    topic_tags: [tier-2, cbo, labor-supply-elasticity, survey, substitution-income-effect, participation-elasticity, prime-age-men, thread-a, thread-b-angle1, thread-3-targetpool]
    path: Infrastructure/references/literature/summaries/2012_mcclelland-mok_cbo-review-labor-supply-elasticities.md
    summary_path: Infrastructure/references/literature/summaries/2012_mcclelland-mok_cbo-review-labor-supply-elasticities.md
    source_url: https://www.cbo.gov/publication/43675
    added_on: 2026-06-25
    status: parsed
    relevance_note: "Official CBO elasticity review (pub 43675); reviews literature but does NOT itself state CBO's central set. Central params (substitution 0.24, income -0.05, aggregate ~0.19) are in companion pub 43674; 0.24/-0.05 corroborated, verbatim 0.19 unconfirmed (CBO PDFs block automated fetch). Thread-3 group ranges added: participation elasticity ~0-0.1 for men/single women (the largest 80-80 entry pool), ~0-0.3 married women, substantially higher for EITC-eligible single mothers (Chetty 0.25, Card-Hyslop ~0.4 cited); hours response small. The requested verbatim '0.3-1.2' EITC-eligible and '-0.1 to 0.2' hours ranges remain [unverified] vs the 403-blocked PDF; the men/single-women ~0-0.1 anchor is corroborated."

