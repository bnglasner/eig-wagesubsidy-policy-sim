    doi: 10.1016/j.jpubeco.2008.02.007
    added_on: 2026-07-08
    status: parsed
    relevance_note: "French Prime pour l'Emploi (PPE), household-income-tested and structurally distinct from the EITC. Finds a significant NEGATIVE employment effect for married women (household income test disincentive), weak positive for cohabiting women, insignificant for lone mothers. Isolates household-income-testing as an independent design lever distinct from annual timing or categorical eligibility -- directly relevant to Requirement M5 (net-of-household-income reservation framing). JPubEc 92(10-11):2036-2047 (DOI validated). 2026-07-08 addendum (other_women pass): assessment structure re-verified -- PPE is computed on INDIVIDUAL earnings with an eligibility ceiling on total household resources; the married (jointly taxed, ~-3pp) vs cohabiting (individually taxed, POSITIVE) contrast is the catalog's closest within-paper test of individual vs household assessment holding the instrument fixed. See updated summary."

  - id: 2019-azmat-incidence-salience-spillovers-tax-credits
    title: "Incidence, Salience and Spillovers: The Direct and Indirect Effects of Tax Credits on Wages"
