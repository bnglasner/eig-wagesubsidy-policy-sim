    doi: 10.1257/aer.97.1.298
    added_on: 2026-07-09
    status: parsed
    relevance_note: "The cleanest measured hours response to a salient, per-unit, NO-phase-out wage increase (randomized 25 percent commission raise, Zurich bike messengers; IZA DP 1002 read in full): Frisch elasticity of overall labor supply 1.12-1.25, of shifts worked 1.34-1.50; effort per shift -6 percent (loss-averse workers only). Directly stress-tests eps_int=0.05: the EITC hours null reflects the EITC's plateau/phase-out design, not a general hours non-response; for the 80-80's transparent 54-percent marginal-hour raise, 0.05 is a lower bound (hours constraints per Chetty 2012), not a central case -- the Chetty Hicksian intensive 0.33 is the better central anchor. Frisch/transitory caveat: upper bound for a permanent subsidy. AER 97(1):298-317 (DOI validated)."

  - id: 2016-schmieder-vonwachter-bender-nonemployment-wages
    title: "The Effect of Unemployment Benefits and Nonemployment Durations on Wages"
    type: paper
