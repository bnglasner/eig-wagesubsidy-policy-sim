    source_url: https://www.journals.uchicago.edu/doi/abs/10.1086/697739
    doi: 10.1086/697739
    added_on: 2026-07-09
    status: parsed
    relevance_note: "Companion to Krueger-Mueller 2016 (same NJ survey data): identifies from actual acceptance decisions the distributions of offered wages (SD 0.24), NONWAGE job values (SD 0.34, larger than wages), job values (0.38), and personal productivity (0.43). Jobseekers frequently accept below their stated reservation wage; ~two-thirds of offer rejections are NONWAGE-motivated. Key for interpreting the model's calibrated reservation markups: large implied wage-multiples bundle nonwage job values and non-work option values (health, caregiving, benefits) -- and symmetrically, a pure wage fill moves only the wage argument of the job-value comparison, so entry responses run below wage-gap-closure arithmetic. UI-recipient unemployed sample; NO direct NILF measurement. JPE 126(4):1594-1637 (DOI validated). [unverified: mean flow value of nonwork not pinned]."

