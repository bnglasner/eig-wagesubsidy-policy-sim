    status: parsed
    relevance_note: "BPEA Fall 2017 conference PDF read directly. Composition evidence on the NILF pool the 80-80 draws from: ~half of NILF prime-age men may have a serious health condition barring work; 44-47 percent took pain medication the previous day (~2/3 prescription); 25-35 percent on SSDI and ~half may ever have applied; opioid-prescription growth accounts for ~0.6pp / ~20 percent of the male LFP decline 1999-2015 (the circulating '43 percent' is an earlier-draft figure, NOT in this version); 60 percent of NILF prime-age women cite home responsibilities and show no SWB evidence of eagerness to return; 2007-17 retirement-rate rise (2.2pp) nearly matches the LFP decline (2.8pp) and retirements are permanent exits; youth decline offset by schooling. Directly disciplines the entry-risk share of the 59M pool. BPEA 2017(2):1-87 (DOI via Crossref). [unverified: final published pagination not re-checked against conference draft]."

  - id: 2007-fehr-goette-wages-high-field-experiment
    title: "Do Workers Work More if Wages Are High? Evidence from a Randomized Field Experiment"
    type: paper
    topic_tags: [tier-1, intensive-margin, hours-elasticity, frisch, clean-wage-variation, no-phase-out, field-experiment, measured-ex-post, thread-a, thread-7-entry-anchor]
    path: Infrastructure/references/literature/summaries/2007_fehr-goette_workers-work-more-wages-high.md
